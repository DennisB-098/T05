<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f2">
  <title>Insights Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">OVERVIEW</p>
        <h1>Insights</h1>
      </div>
      <p class="header-note">Your data, at a glance</p>
    </header>

    <section class="chart-grid" aria-label="Dashboard charts">
      <article class="chart-panel">
        <h2>Chart one</h2>
        <div class="chart-placeholder" id="chart-one" role="img" aria-label="Chart one placeholder"></div>
      </article>
      <article class="chart-panel">
        <h2>Chart two</h2>
        <div class="chart-placeholder" id="chart-two" role="img" aria-label="Chart two placeholder"></div>
      </article>
      <article class="chart-panel">
        <h2>Chart three</h2>
        <div class="chart-placeholder" id="chart-three" role="img" aria-label="Chart three placeholder"></div>
      </article>
      <article class="chart-panel">
        <h2>Chart four</h2>
        <div class="chart-placeholder" id="chart-four" role="img" aria-label="Chart four placeholder"></div>
      </article>
    </section>
  </main>
</body>
</html>
