<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5f2">
    <title>Insights Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <div>
                <p class="eyebrow">OVERVIEW</p>
                <h1>Insights</h1>
            </div>
            <p class="header-note">Your data, at a glance</p>
        </header>

        <section class="chart-grid" aria-label="Dashboard charts">
            <article class="chart-panel">
                <h2>TV energy consumption vs star rating</h2>
                <div class="chart-placeholder scatter-plot" id="chart-one" role="img" aria-label="Scatter plot of TV energy consumption versus star rating"></div>
            </article>

            <article class="chart-panel">
                <h2>Mean energy consumption by screen technology</h2>
                <div class="chart-placeholder donut-chart" id="chart-two" role="img" aria-label="Donut chart of mean annual TV energy consumption by screen technology across all sizes"></div>
            </article>

            <article class="chart-panel">
                <h2>55-inch TV energy consumption by screen technology</h2>
                <div class="chart-placeholder bar-chart" id="chart-three" role="img" aria-label="Bar chart of mean annual energy consumption for 55-inch TVs by screen technology"></div>
            </article>

            <article class="chart-panel">
                <h2>Average Australian spot power price, 1998–2024</h2>
                <div class="chart-placeholder line-chart" id="chart-four" role="img" aria-label="Line chart of average Australian spot power prices from 1998 to 2024"></div>
            </article>
        </section>
    </main>
    <script type="module" src="load_data.js"></script>
    <script type="module" src="charts/Scatter_plot.js"></script>
    <script type="module" src="charts/Donut_chart.js"></script>
    <script type="module" src="charts/Bar_chart.js"></script>
    <script type="module" src="charts/Line_chart.js"></script>
</body>

</html>
